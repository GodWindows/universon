server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    # Redirections relatives : gardent l'hôte et le port d'origine
    absolute_redirect off;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    # API Node (même origine : pas de CORS, les cookies passent)
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Anciennes adresses PHP
    location = /index.php            { return 301 /; }
    location = /pages/login.php      { return 301 /login; }
    location = /pages/dashboard.php  { return 301 /dashboard; }

    # Fichiers générés par Vite (nom avec empreinte) et images
    location /assets/ { expires 1y; access_log off; }
    location /img/    { expires 1y; access_log off; }

    # Application React : toutes les autres routes (/, /login, /dashboard, /@pseudo)
    location / {
        try_files $uri /index.html;
    }
}
